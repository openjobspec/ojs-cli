# GoReleaser configuration for ojs-cli
version: 2

project_name: ojs

before:
  hooks:
    - sh -c 'GOWORK=off go mod tidy -diff'
    - sh -c 'GOWORK=off GOFLAGS=-mod=readonly go test ./...'

builds:
  - main: ./cmd/ojs
    binary: ojs
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats:
      - tar.gz
    name_template: "ojs_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'

nfpms:
  - package_name: ojs
    maintainer: "Open Job Spec Maintainers <security@openjobspec.org>"
    homepage: https://openjobspec.org
    description: "CLI for Open Job Spec servers"
    license: "Apache-2.0"
    formats:
      - deb
      - rpm
