name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
      GOFLAGS: "-mod=readonly"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: go.sum

      - name: Validate tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          EXPECTED_VERSION=$(python3 -c 'import re; print(re.search(r"^## \[([0-9]+\.[0-9]+\.[0-9]+)\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$", open("CHANGELOG.md").read(), re.MULTILINE).group(1))')
          if [ "$TAG" != "v${EXPECTED_VERSION}" ]; then
            echo "::error::Tag ${TAG} does not match package release v${EXPECTED_VERSION}"
            exit 1
          fi

      - name: Test
        run: make test

      - name: Install GoReleaser
        run: GOWORK=off go install github.com/goreleaser/goreleaser/v2@v2.17.0

      - name: Publish release artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --clean
